name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # ubuntu-24.04 的 actions/setup-python 没有 Python 3.9 的构建，
    # 而 pyproject.toml 声明 requires-python = ">=3.9"，所以固定 22.04。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test (demo repo, no external data)
        run: |
          ai-attrib demo -o /tmp/demo.md
          test -s /tmp/demo.md
          grep -q "declared AI involvement" /tmp/demo.md
